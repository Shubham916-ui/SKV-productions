<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Primary Meta Tags -->
    <title>SKV Productions</title>
    <meta name="description" content="SKV Productions is a premium website design studio crafting stunning digital experiences." />

    <!-- Favicon & Touch Icons for Google Search and Browsers -->
    <link rel="icon" type="image/png" href="/skv-logo.png" />
    <link rel="shortcut icon" type="image/png" href="/skv-logo.png" />
    <link rel="apple-touch-icon" href="/skv-logo.png" />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SKV Productions" />
    <meta property="og:url" content="https://www.skvproductions.in/" />
    <meta property="og:title" content="SKV Productions" />
    <meta property="og:description" content="SKV Productions is a premium website design studio crafting stunning digital experiences." />
    <meta property="og:image" content="https://www.skvproductions.in/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.skvproductions.in/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SKV Productions" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.skvproductions.in/" />
    <meta name="twitter:title" content="SKV Productions" />
    <meta name="twitter:description" content="SKV Productions is a premium website design studio crafting stunning digital experiences." />
    <meta name="twitter:image" content="https://www.skvproductions.in/og-image.jpg" />

    <!-- Structured Data (Schema.org Organization Logo for Google Search) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SKV Productions",
        "url": "https://www.skvproductions.in",
        "logo": "https://www.skvproductions.in/skv-logo.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
